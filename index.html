<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阿源的小站 · 个人主页</title>
  <meta name="description" content="阿源的个人主页：AI 与开源社区爱好者，博客与常用网址导航。" />
  <script src="assets/theme.js"></script>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">阿源<em id="logo-accent">小站</em></a>
      <nav class="main-nav">
        <a href="index.html" class="active"><span class="no">01</span>主页</a>
        <a href="blog/index.html"><span class="no">02</span>博客</a>
        <a href="nav.html"><span class="no">03</span>网址导航</a>
      </nav>
      <button class="theme-toggle" type="button"></button>
    </div>
  </header>

  <main class="container">
    <!-- Hero：杂志封面式开场 -->
    <section class="hero">
      <p class="kicker">Personal Site · 个人主页</p>
      <h1 id="hero-title">你好，我是 <span class="dim">你的名字</span>。</h1>
      <p class="tagline" id="hero-tagline"></p>
      <div class="hero-meta">
        <span><span class="label">BLOG</span><a href="blog/index.html">看看我的博客</a></span>
        <span><span class="label">NAV</span><a href="nav.html">网址导航</a></span>
        <span><span class="label">MAIL</span><a id="hero-email" href="#"></a></span>
      </div>
    </section>

    <!-- 关于我：三栏杂志分栏 -->
    <section class="section">
      <p class="kicker">About · 关于我</p>
      <div class="about-grid">
        <div class="about-col">
          <h3>关于我</h3>
          <p id="about-text" class="dim"></p>
        </div>
        <div class="about-col">
          <h3>技能</h3>
          <p id="skills-text" class="dim"></p>
        </div>
        <div class="about-col">
          <h3>联系我</h3>
          <p class="dim">邮箱：<a id="contact-email" href="#"></a></p>
          <p id="contact-extra" class="dim" style="margin-top:8px"></p>
        </div>
      </div>
    </section>

    <!-- 个人成果：由 assets/site-data.js 的 projects 自动渲染 -->
    <section class="section">
      <p class="kicker">Projects · 个人成果</p>
      <h2 class="section-title">开源与研究</h2>
      <p class="section-lede">全部仓库见 <a id="projects-profile-link" href="#">GitHub 主页</a>。</p>
      <div class="post-list" id="project-list"></div>
      <div id="project-image"></div>
    </section>

    <!-- 最新文章：由 assets/posts-data.js 自动渲染 -->
    <section class="section">
      <p class="kicker">Writing · 最新文章</p>
      <h2 class="section-title">近期写作</h2>
      <p class="section-lede">全部文章在<a href="blog/index.html">博客页</a>。</p>
      <div class="post-list" id="recent-posts"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© 2026 <span id="footer-name">我的小站</span></span>
      <span>上网从<a href="nav.html">这里</a>开始 · 数据都存在你自己的浏览器里</span>
    </div>
  </footer>

  <script src="assets/site-data.js"></script>
  <script src="assets/posts-data.js"></script>
  <script>
    // ---------- 站点信息填槽 ----------
    document.title = SITE.siteName + " · 个人主页";
    document.getElementById("logo-accent").textContent = SITE.siteNameAccent;
    document.getElementById("hero-title").innerHTML =
      "你好，我是 <span class=\"dim\">" + SITE.owner + "</span>。";
    document.getElementById("hero-tagline").textContent = SITE.tagline;
    document.getElementById("about-text").textContent = SITE.about;
    document.getElementById("skills-text").textContent =
      SITE.skills.split(",").map(s => s.trim()).filter(Boolean).join(" · ");

    var email = SITE.email;
    var mailHref = email ? "mailto:" + email : "";
    var heroMail = document.getElementById("hero-email");
    heroMail.textContent = email || "邮箱待补充";
    heroMail.href = mailHref;
    var contactMail = document.getElementById("contact-email");
    contactMail.textContent = email || "邮箱待补充";
    contactMail.href = mailHref;
    document.getElementById("contact-extra").textContent =
      SITE.github ? "GitHub：@" + SITE.github.replace(/^https?:\/\/github\.com\//i, "").replace(/\/$/, "") : "";
    document.getElementById("footer-name").textContent = SITE.siteName;

    // ---------- 个人成果（真实公开仓库） ----------
    var profileLink = document.getElementById("projects-profile-link");
    profileLink.href = SITE.github ? "https://github.com/" + SITE.github : "#";
    profileLink.textContent = SITE.github ? "GitHub @" + SITE.github : "GitHub 主页";
    var plist = document.getElementById("project-list");
    plist.innerHTML = (SITE.projects || [])
      .map(function (p) {
        var tags = '<span class="post-row-tags">';
        if (p.extra) tags += '<a href="' + p.extra.url + '">' + p.extra.label + "</a> · ";
        tags += "GitHub ↗</span>";
        return (
          '<a class="post-row proj-row" href="' + p.url + '">' +
          '<span class="post-row-date">' + p.name + "</span>" +
          '<span><span class="post-row-title">' + p.desc + "</span></span>" +
          tags +
          "</a>"
        );
      })
      .join("");
    var pimage = document.getElementById("project-image");
    pimage.innerHTML = (SITE.projects || [])
      .filter(function (p) { return p.image; })
      .map(function (p) {
        return (
          '<a class="proj-image-card" href="' + p.url + '">' +
          '<img src="' + p.image + '" alt="' + (p.imageAlt || "") + '" loading="lazy" ' +
          'onerror="this.closest(\'a\').style.display=\'none\'">' +
          "<span>" + p.name + " · " + (p.imageAlt || "") + "</span>" +
          "</a>"
        );
      })
      .join("");

    // ---------- 最新文章（杂志目录式，取最近 3 篇） ----------
    var recent = document.getElementById("recent-posts");
    recent.innerHTML = POSTS.slice(0, 3)
      .map(function (p) {
        return (
          '<a class="post-row" href="' + p.file + '">' +
          '<span class="post-row-date">' + p.date + "</span>" +
          '<span><span class="post-row-title">' + p.title + "</span>" +
          '<span class="post-row-summary">' + p.summary + "</span></span>" +
          '<span class="post-row-tags">' + p.tags.join(" / ") + "</span>" +
          "</a>"
        );
      })
      .join("");
  </script>
</body>
</html>
